<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GZG 语言 · 设计与实现</title>
<style>/* GZG 介绍网页：深蓝星轨风格。舞台固定 1600×900，按窗口等比缩放。 */
:root {
  --white: #fff; --text: #e6ecf8; --muted: #93a3c4; --dim: #5e6f96; --ice: #a9cbff; --sky: #5b95f7;
  --crimson: #e2554f; --warm: #f2a65a; --panel: rgba(5, 10, 30, .78);
  --serif: "Noto Serif SC", "STZhongsong", "Songti SC", "SimSun", Georgia, serif;
  --sans: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
  --mono: "Cascadia Code", Consolas, "SFMono-Regular", Menlo, "Microsoft YaHei", monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #02040f; color: var(--text); font-family: var(--sans); }
body { cursor: default; -webkit-font-smoothing: antialiased; }

/* 背景：静态星轨图 + 实时星轨画布 + 暗角 */
#bg { position: fixed; inset: 0; z-index: 0; }
#bg .img { position: absolute; inset: -4%; background-size: cover; background-position: center; opacity: 0;
  transition: opacity 1.4s var(--ease), transform 1.4s var(--ease); transform: scale(1.04); }
#bg .img.on { opacity: 1; transform: scale(1); }
#bg canvas { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: screen; }
#bg .vignette { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0, 0, 0, .55) 100%); }

/* 舞台与幻灯片 */
#stage { position: fixed; left: 50%; top: 50%; width: 1600px; height: 900px; z-index: 2;
  transform: translate(-50%, -50%) scale(var(--scale, 1)); transform-origin: center; }
.slide { position: absolute; inset: 0; opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity .8s var(--ease), transform .9s var(--ease), filter .8s var(--ease), visibility 0s .9s; }
.slide.before { transform: translateY(-40px) scale(1.03); filter: blur(8px); }
.slide.after { transform: translateY(40px) scale(.97); filter: blur(8px); }
.slide.active { opacity: 1; visibility: visible; pointer-events: auto; transform: none; filter: none;
  transition: opacity .8s var(--ease) .15s, transform .9s var(--ease) .15s, filter .8s var(--ease) .15s, visibility 0s; }

/* 逐个出现：.rv 元素用 --d 控制延迟 */
.rv { opacity: 0; transform: translateY(26px); transition: opacity .7s var(--ease), transform .8s var(--ease); }
.slide.active .rv { opacity: 1; transform: none; transition-delay: calc(var(--d, 0) * 1ms + 350ms); }

/* 页眉页脚 */
.brand { position: absolute; left: 58px; top: 38px; display: flex; align-items: center; gap: 12px;
  font: 700 22px/1 "Segoe UI", sans-serif; color: #fff; letter-spacing: .5px; z-index: 5; cursor: pointer; }
.brand .mark { display: grid; grid-template-columns: repeat(2, 13px); gap: 4px; }
.brand .mark i { width: 13px; height: 13px; border-radius: 3px; background: #fff; transition: transform .5s var(--ease); }
.brand .mark i:last-child { background: var(--crimson); }
.brand:hover .mark i:nth-child(1) { transform: translate(-3px, -3px); }
.brand:hover .mark i:nth-child(2) { transform: translate(3px, -3px); }
.brand:hover .mark i:nth-child(3) { transform: translate(-3px, 3px); }
.brand:hover .mark i:nth-child(4) { transform: translate(3px, 3px) rotate(45deg); }
.tagline { position: fixed; right: 64px; top: 40px; z-index: 5; text-align: right; font-size: 13px; line-height: 1.3;
  color: var(--ice); opacity: .85; }
.footer { position: absolute; left: 72px; right: 72px; bottom: 30px; display: flex; justify-content: space-between;
  border-top: 1px solid rgba(255, 255, 255, .14); padding-top: 12px; font-size: 12px; color: var(--dim); }
.footer .num { font-family: var(--mono); letter-spacing: 1px; }
.kicker { position: absolute; left: 72px; top: 112px; font: 700 14px/1 "Segoe UI", sans-serif; letter-spacing: 4px;
  color: var(--crimson); }
.title { position: absolute; left: 72px; top: 140px; right: 72px; font: 400 44px/1.15 var(--serif); color: #fff;
  letter-spacing: 3px; text-shadow: 0 0 30px rgba(120, 160, 255, .25); }
.sub { position: absolute; left: 72px; top: 212px; right: 72px; font-size: 19px; color: var(--muted); }
.grid { position: absolute; left: 72px; width: 1456px; }
.blk { position: absolute; }

/* 卡片 */
.card { position: absolute; inset: 0; background: rgba(255, 255, 255, .055); border: 1px solid rgba(255, 255, 255, .15);
  border-radius: 16px; backdrop-filter: blur(6px); padding: 30px 30px 24px;
  transition: transform .5s var(--ease), border-color .4s, background .4s, box-shadow .5s; }
.card::before { content: ""; position: absolute; left: 26px; top: -1px; width: 58px; height: 3px; background: var(--crimson);
  border-radius: 2px; transition: width .6s var(--ease); }
.card.warm::before { background: var(--warm); }
.card:hover { transform: translateY(-6px); border-color: rgba(169, 203, 255, .45); background: rgba(91, 149, 247, .09);
  box-shadow: 0 18px 50px -20px rgba(91, 149, 247, .55); }
.card:hover::before { width: 120px; }
.card h3 { font: 400 22px/1.3 var(--serif); color: var(--ice); margin-bottom: 18px; }
.card.warm h3 { color: var(--warm); }
.card li { list-style: none; position: relative; padding-left: 20px; margin-bottom: 9px; line-height: 1.5; }
.card li::before { content: "·"; position: absolute; left: 4px; color: var(--crimson); font-weight: 700; }

/* 数字卡片 */
.stat .value { font: 400 66px/1 var(--serif); color: #fff; margin-top: 18px; white-space: nowrap; }
.stat .value small { font: 400 22px var(--sans); color: var(--ice); margin-left: 6px; }
.stat .value { font-size: 76px; }
.stat .label { font-weight: 700; font-size: 23px; color: var(--ice); margin: 26px 0 16px; }
.stat .note { font-size: 17px; color: var(--muted); line-height: 1.65; }
.stat:hover .value { text-shadow: 0 0 28px rgba(169, 203, 255, .6); }

/* 列表 */
.bullets li { list-style: none; position: relative; padding-left: 28px; line-height: 1.5; margin-bottom: .55em; }
.bullets li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 8px; height: 8px; border-radius: 50%;
  background: var(--crimson); box-shadow: 0 0 10px rgba(226, 85, 79, .8); }
.bullets b, .hl { color: var(--ice); font-weight: 700; margin-right: .6em; }
/* 表格 */
.tbl { width: 100%; border-collapse: collapse; table-layout: fixed; }
.tbl th { text-align: left; color: var(--ice); font-weight: 700; padding: 9px 14px; background: rgba(255, 255, 255, .07);
  border-bottom: 2px solid var(--crimson); }
.tbl td { padding: 9px 14px; border-bottom: 1px solid rgba(255, 255, 255, .1); line-height: 1.45; vertical-align: middle;
  transition: background .3s, color .3s; }
.tbl td:first-child { color: #fff; font-weight: 700; }
.tbl tr:hover td { background: rgba(91, 149, 247, .12); color: #fff; }
.tbl.right td:not(:first-child), .tbl.right th:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
.tbl tr.total td { color: var(--warm); font-weight: 700; }
.tbl code { font-family: var(--mono); font-size: .92em; color: var(--ice); }

/* 代码面板 */
.code { position: absolute; inset: 0; background: var(--panel); border: 1px solid rgba(255, 255, 255, .14);
  border-radius: 14px; overflow: hidden; box-shadow: 0 30px 80px -30px rgba(0, 0, 0, .8); }
.code .bar { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; background: rgba(255, 255, 255, .03);
  border-bottom: 1px solid rgba(255, 255, 255, .06); font: 13px var(--mono); color: var(--dim); }
.code .bar i { width: 12px; height: 12px; border-radius: 50%; background: var(--crimson); }
.code .bar i:nth-child(2) { background: var(--warm); }
.code .bar i:nth-child(3) { background: #5dbb7a; margin-right: 14px; }
.code .bar .copy { margin-left: auto; cursor: pointer; padding: 3px 10px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, .15);
  opacity: 0; transition: opacity .3s, background .3s; }
.code:hover .copy { opacity: 1; }
.code .copy:hover { background: rgba(255, 255, 255, .1); color: #fff; }
.code pre { padding: 16px 24px; font-family: var(--mono); line-height: 1.5; color: #d8e2f5; white-space: pre; }
.code pre span.ln { display: block; opacity: 0; transform: translateX(-10px); transition: opacity .4s, transform .5s var(--ease); }
.slide.active .code pre span.ln { opacity: 1; transform: none; transition-delay: calc(var(--i) * 32ms + 500ms); }
.c-kw { color: #7fb2ff; } .c-str { color: #f4a07a; } .c-num { color: #e8777c; } .c-cmt { color: #6d80aa; font-style: italic; }
.c-call { color: #9ee6ff; } .c-ice { color: var(--ice); } .c-warm { color: var(--warm); } .c-crimson { color: var(--crimson); }
.c-sky { color: var(--sky); } .c-dim { color: var(--dim); } .c-code { color: #d8e2f5; }

/* 流水线 */
.pipe { position: absolute; inset: 0; display: flex; align-items: stretch; gap: 42px; }
.pipe .st { flex: 1; position: relative; border-radius: 16px; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .18);
  text-align: center; padding-top: 30px; transition: all .5s var(--ease); }
.pipe .st h4 { font: 400 26px var(--serif); color: #fff; margin-bottom: 14px; }
.pipe .st p { font-size: 15px; color: var(--muted); line-height: 1.55; white-space: pre-line; }
.pipe .st.hot, .pipe .st.lit { background: rgba(91, 149, 247, .26); border-color: rgba(169, 203, 255, .6);
  box-shadow: 0 0 40px -6px rgba(91, 149, 247, .7); }
.pipe .st.hot p, .pipe .st.lit p { color: var(--ice); }
.pipe .st:not(:last-of-type)::after { content: "›"; position: absolute; right: -32px; top: 50%; transform: translateY(-55%);
  font: 700 40px/1 var(--sans); color: var(--crimson); }
.pipe .packet { position: absolute; top: -6px; width: 12px; height: 12px; border-radius: 50%; background: #fff;
  box-shadow: 0 0 16px 4px rgba(169, 203, 255, .9); pointer-events: none; }

/* 步骤 */
.steps { position: absolute; inset: 0; display: flex; }
.steps .rail { position: absolute; left: 12.5%; right: 12.5%; top: 38px; height: 2px; background: rgba(255, 255, 255, .2); }
.steps .rail b { position: absolute; left: 0; top: 0; height: 100%; width: 0; background: linear-gradient(90deg, var(--sky), var(--crimson));
  transition: width .9s var(--ease); }
.steps .s { flex: 1; text-align: center; position: relative; }
.steps .dot { width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 50%; background: #0b1a48; border: 2px solid var(--ice);
  display: grid; place-items: center; font: 30px var(--serif); color: #fff; transition: all .5s var(--ease); }
.steps .s.on .dot { background: var(--sky); box-shadow: 0 0 34px rgba(91, 149, 247, .9); transform: scale(1.08); }
.steps h4 { font: 400 23px var(--serif); color: var(--ice); margin-bottom: 8px; }
.steps p { font-size: 15px; color: var(--muted); padding: 0 20px; line-height: 1.5; }

/* 条形图 */
.bars { position: absolute; inset: 0; display: flex; flex-direction: column; }
.bars .cap { font-size: 17px; color: var(--muted); margin-bottom: 10px; }
.bars .row { flex: 1; display: flex; align-items: center; gap: 14px; cursor: default; min-height: 0; }
.bars .row .n { width: 120px; font-size: 15px; color: var(--text); }
.bars .row .t { flex: 1; height: 13px; border-radius: 8px; background: rgba(255, 255, 255, .06); overflow: hidden; }
.bars .row .t b { display: block; height: 100%; width: 0; border-radius: 8px; background: var(--sky); transition: width 1.1s var(--ease); }
.bars .row:first-of-type .t b { background: var(--crimson); }
.bars .row .v { width: 56px; text-align: right; font-size: 15px; color: var(--ice); font-variant-numeric: tabular-nums; }
.bars .row:hover .n, .bars .row:hover .v { color: #fff; }
.bars .row:hover .t b { filter: brightness(1.35); }

/* 胶囊、引用 */
.pills { display: flex; flex-wrap: wrap; gap: 12px; }
.pill { padding: 10px 20px; border-radius: 999px; border: 1px solid rgba(169, 203, 255, .45); background: rgba(91, 149, 247, .14);
  font-size: 16px; color: #fff; transition: all .35s var(--ease); }
.pill:hover { background: rgba(91, 149, 247, .35); transform: translateY(-3px); box-shadow: 0 10px 30px -10px var(--sky); }
.quote { position: absolute; inset: 0; display: flex; align-items: center; border-left: 4px solid var(--crimson); padding-left: 28px;
  font: 400 23px/1.55 var(--serif); color: #fff; }
/* 图表 */
.chart { position: absolute; inset: 0; }
.chart .tabs { position: absolute; right: 0; top: 0; display: flex; gap: 6px; z-index: 2; }
.chart .tabs button { font: 14px var(--sans); color: var(--muted); background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .15);
  padding: 6px 14px; border-radius: 8px; cursor: pointer; transition: all .3s; }
.chart .tabs button.on, .chart .tabs button:hover { color: #fff; background: rgba(91, 149, 247, .3); border-color: rgba(169, 203, 255, .5); }
.chart .legend { position: absolute; left: 60px; top: 6px; display: flex; gap: 20px; font-size: 14px; color: var(--text); }
.chart .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 7px; vertical-align: -1px; }
.chart svg { position: absolute; left: 0; top: 40px; width: 100%; height: calc(100% - 40px); overflow: visible; }
.chart .bar { transition: transform .9s var(--ease), filter .3s; cursor: pointer; }
.chart .bar:hover { filter: brightness(1.3); }
.chart text { font-family: var(--sans); fill: var(--muted); font-size: 13px; }
.chart .grid line { stroke: rgba(255, 255, 255, .08); }
.tip { position: fixed; z-index: 50; pointer-events: none; padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.5;
  background: rgba(8, 14, 40, .92); border: 1px solid rgba(169, 203, 255, .4); color: #fff; opacity: 0;
  transform: translate(-50%, calc(-100% - 14px)); transition: opacity .2s; white-space: nowrap; }
.tip.on { opacity: 1; }

/* 2048 */
.g2048 { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; }
.g2048 .board { position: relative; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .2); border-radius: 14px; }
.g2048 .tile { position: absolute; display: grid; place-items: center; border-radius: 10px; font-weight: 800; color: #fff;
  transition: left .12s ease, top .12s ease; }
.g2048 .tile.new { animation: pop .22s var(--ease); }
.g2048 .tile.merged { animation: bump .2s var(--ease); }
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes bump { 50% { transform: scale(1.14); } }
.g2048 .info { margin-top: 14px; font-size: 15px; color: var(--muted); text-align: center; line-height: 1.6; }
.g2048 .info b { color: #fff; } .g2048 .info kbd { font: 12px var(--mono); padding: 1px 6px; border-radius: 4px;
  border: 1px solid rgba(255, 255, 255, .25); color: var(--ice); }

/* 封面与结尾 */
.cover .t1 { position: absolute; left: 0; right: 0; top: 300px; text-align: center; font: 400 96px/1 var(--serif); color: #fff;
  letter-spacing: 34px; padding-left: 34px; text-shadow: 0 0 40px rgba(140, 180, 255, .45); }
.cover .t1 span { display: inline-block; opacity: 0; transform: translateY(30px) scale(.9); filter: blur(10px);
  transition: all 1.1s var(--ease); }
.slide.active.cover .t1 span { opacity: 1; transform: none; filter: none; transition-delay: calc(var(--i) * 110ms + 300ms); }
.cover .en { position: absolute; left: 0; right: 0; top: 432px; text-align: center; font: italic 22px Georgia, serif; color: var(--ice);
  letter-spacing: 4px; }
.cover .s2 { position: absolute; left: 0; right: 0; top: 640px; text-align: center; font: 400 30px var(--serif); color: #fff; letter-spacing: 9px; }
.cover .rule { position: absolute; left: 50%; top: 702px; width: 0; height: 1px; background: rgba(255, 255, 255, .75);
  transform: translateX(-50%); transition: width 1.4s var(--ease) 1.4s; }
.slide.active.cover .rule { width: 560px; }
.cover .au { position: absolute; left: 0; right: 0; top: 724px; text-align: center; font-size: 18px; color: var(--text); letter-spacing: 3px; }
.cover .hint { position: absolute; left: 0; right: 0; bottom: 36px; text-align: center; font-size: 13px; color: var(--ice); opacity: .7;
  animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .25; transform: translateY(4px); } }
.end .panel { position: absolute; left: 330px; right: 330px; top: 410px; padding: 34px 48px; border-radius: 18px;
  background: rgba(5, 10, 30, .5); border: 1px solid rgba(255, 255, 255, .18); backdrop-filter: blur(8px); }

/* 导航 */
#progress { position: fixed; left: 0; top: 0; height: 2px; z-index: 20; background: linear-gradient(90deg, var(--sky), var(--crimson));
  transition: width .8s var(--ease); box-shadow: 0 0 12px var(--sky); }
#dots { position: fixed; right: 26px; top: 50%; transform: translateY(-50%); z-index: 20; display: flex; flex-direction: column; gap: 9px; }
#dots a { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, .25); cursor: pointer; position: relative;
  transition: all .4s var(--ease); }
#dots a.on { background: var(--crimson); height: 22px; border-radius: 4px; box-shadow: 0 0 10px var(--crimson); }
#dots a span { position: absolute; right: 20px; top: 50%; transform: translate(6px, -50%); white-space: nowrap; font-size: 13px; color: #fff;
  background: rgba(8, 14, 40, .85); padding: 4px 10px; border-radius: 6px; opacity: 0; pointer-events: none; transition: all .25s; }
#dots a:hover span { opacity: 1; transform: translate(0, -50%); }
#help { position: fixed; left: 50%; bottom: 6px; transform: translateX(-50%); z-index: 20; font-size: 11px; color: var(--dim);
  opacity: .55; transition: opacity .3s; }
#help:hover { opacity: 1; }
#help kbd { font: 11px var(--mono); border: 1px solid rgba(255, 255, 255, .2); border-radius: 4px; padding: 1px 5px; margin: 0 2px; }

/* 总览模式（按 O） */
body.overview #stage { transform: translate(-50%, -50%) scale(calc(var(--scale) * .155)); }
body.overview #stage > .brand, body.overview #dots, body.overview #help { opacity: 0; pointer-events: none; }
body.overview .slide { opacity: 1; visibility: visible; pointer-events: auto; filter: none; cursor: pointer;
  transform: translate(calc(var(--ox) * 1px), calc(var(--oy) * 1px)) scale(.94); border: 6px solid rgba(255, 255, 255, .15);
  border-radius: 30px; background: rgba(4, 8, 28, .82); transition: transform .7s var(--ease), border-color .3s; }
body.overview .slide:hover { border-color: var(--sky); }
body.overview .slide.active { border-color: var(--crimson); }
body.overview .rv, body.overview .code pre span.ln, body.overview .cover .t1 span { opacity: 1; transform: none; filter: none; }
body.overview .cover .rule { width: 560px; }
@media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; animation: none !important; } }

/* 截图模式（URL 带 ?capture）：关闭过渡，直接显示最终状态，用于自动检查版式 */
body.capture *, body.capture *::before, body.capture *::after { transition: none !important; animation: none !important; }
</style>

<script>/* 实时星轨：粒子沿倾斜椭圆旋转，叠加在静态背景图上。翻页时短暂加速并拉长（跃迁效果），随鼠标轻微视差。 */
const Stars = (() => {
  const cv = document.querySelector("#bg canvas");
  const ctx = cv.getContext("2d");
  const COLORS = [[170, 200, 255], [100, 145, 255], [255, 255, 255], [255, 105, 95], [255, 190, 130]];
  const WEIGHTS = [0.5, 0.28, 0.12, 0.07, 0.03];
  const PRESETS = {
    cover: { cx: 0.58, cy: 0.5, rx: 0.55, ry: 0.42, tilt: -0.28, alpha: 1 },
    dark: { cx: 0.86, cy: 0.62, rx: 0.62, ry: 0.5, tilt: -0.35, alpha: 0.42 },
    end: { cx: 0.42, cy: 0.48, rx: 0.58, ry: 0.44, tilt: 0.25, alpha: 1 },
  };
  let W = 0, H = 0, dpr = 1, parts = [], boost = 0, running = true;
  let target = { ...PRESETS.cover }, cur = { ...PRESETS.cover };
  const mouse = { x: 0.5, y: 0.5 }, sm = { x: 0.5, y: 0.5 };

  function pick() {
    let r = Math.random();
    for (let i = 0; i < WEIGHTS.length; i++) { if ((r -= WEIGHTS[i]) < 0) return i; }
    return 0;
  }

  function spawn(n) {
    parts = [];
    for (let i = 0; i < n; i++) {
      const r = 0.2 + Math.pow(Math.random(), 0.75) * 2.1;
      parts.push({
        r, a: Math.random() * Math.PI * 2,
        v: (0.0005 + Math.random() * 0.0011) / Math.sqrt(r),
        len: 0.008 + Math.random() * 0.045,
        c: COLORS[pick()], b: 0.25 + Math.random() * 0.75, w: 0.5 + Math.random() * 1.3,
        tw: Math.random() * Math.PI * 2,
      });
    }
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = cv.width = Math.round(innerWidth * dpr);
    H = cv.height = Math.round(innerHeight * dpr);
  }

  function frame(t) {
    if (!running) return;
    for (const k of ["cx", "cy", "rx", "ry", "tilt", "alpha"]) cur[k] += (target[k] - cur[k]) * 0.035;
    sm.x += (mouse.x - sm.x) * 0.05;
    sm.y += (mouse.y - sm.y) * 0.05;
    boost *= 0.94;
    const cx = (cur.cx + (sm.x - 0.5) * 0.03) * W, cy = (cur.cy + (sm.y - 0.5) * 0.03) * H;
    const rx = cur.rx * W, ry = cur.ry * H, speed = 1 + boost * 14, stretch = 1 + boost * 7;
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";
    for (const p of parts) {
      p.a += p.v * speed;
      const eye = Math.min(1, Math.max(0, (p.r - 0.28) / 0.5));
      const twinkle = 0.75 + 0.25 * Math.sin(t * 0.002 + p.tw);
      const al = p.b * eye * twinkle * cur.alpha;
      if (al < 0.03) continue;
      ctx.strokeStyle = `rgba(${p.c[0]},${p.c[1]},${p.c[2]},${al.toFixed(3)})`;
      ctx.lineWidth = p.w * dpr * (p.r > 1.2 ? 1.25 : 1);
      ctx.beginPath();
      ctx.ellipse(cx, cy, p.r * rx, p.r * ry, cur.tilt, p.a, p.a + p.len * stretch);
      ctx.stroke();
    }
    requestAnimationFrame(frame);
  }

  addEventListener("resize", resize);
  addEventListener("mousemove", (e) => { mouse.x = e.clientX / innerWidth; mouse.y = e.clientY / innerHeight; });
  document.addEventListener("visibilitychange", () => {
    running = !document.hidden;
    if (running) requestAnimationFrame(frame);
  });
  resize();
  spawn(innerWidth < 900 ? 700 : 1400);
  requestAnimationFrame(frame);

  return {
    /* kind：cover / dark / end；i：页码，用来给内容页一点变化 */
    set(kind, i = 0) {
      const p = { ...PRESETS[kind] };
      if (kind === "dark") { p.cy += Math.sin(i * 1.7) * 0.05; p.tilt += Math.cos(i * 1.3) * 0.08; }
      target = p;
    },
    warp(strength = 1) { boost = Math.min(1.4, boost + strength); },
  };
})();

/* 把 DECK（由 build_web.py 从 content_*.py 生成）渲染成 DOM。坐标与 PPT 一致：1 英寸 = 120px。 */
const Render = (() => {
  const IN = 120, GRID_X = 0.75, GRID_W = 11.83, COL = GRID_W / 12, H_IN = 7.5, PT = IN / 72;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const richText = (s) => s.includes("::") ? `<b>${esc(s.split("::")[0])}</b>${esc(s.split("::").slice(1).join("::"))}` : esc(s);

  /* 缩小字号直到内容放得下 */
  function fit(box, inner, size, min = 10) {
    inner.style.fontSize = size + "px";
    while (size > min && (inner.scrollHeight > box.clientHeight + 1 || inner.scrollWidth > box.clientWidth + 1)) {
      size -= 0.5;
      inner.style.fontSize = size + "px";
    }
  }

  const B = {
    stat(b, box) {
      const c = el("div", "card stat");
      c.innerHTML = `<div class="value"><span class="count" data-to="${esc(b.value)}">${esc(b.value)}</span><small>${esc(b.unit)}</small></div>
        <div class="label">${esc(b.label)}</div><div class="note">${esc(b.note)}</div>`;
      box.append(c);
    },
    bullets(b, box) {
      const ul = el("ul", "bullets");
      b.items.forEach((it, i) => { const li = el("li", "rv", richText(it)); li.style.setProperty("--d", 120 + i * 90); ul.append(li); });
      box.append(ul);
      box.fit = () => fit(box, ul, (b.size || 14) * PT, 13);
    },
    code(b, box) {
      const c = el("div", "code");
      const lines = b.hl.map((ln, i) => `<span class="ln" style="--i:${i}">${ln.map(([t, k]) => `<span class="c-${k}">${esc(t)}</span>`).join("") || " "}</span>`);
      c.innerHTML = `<div class="bar"><i></i><i></i><i></i>${esc(b.title || "")}<span class="copy">复制</span></div><pre>${lines.join("")}</pre>`;
      c.querySelector(".copy").onclick = (e) => {
        navigator.clipboard && navigator.clipboard.writeText(b.src);
        e.target.textContent = "已复制";
        setTimeout(() => (e.target.textContent = "复制"), 1200);
      };
      box.append(c);
      const pre = c.querySelector("pre");
      box.fit = () => {
        let size = (b.size || 13) * PT;
        pre.style.fontSize = size + "px";
        while (size > 10 && (pre.scrollHeight > c.clientHeight - 40 || pre.scrollWidth > c.clientWidth)) pre.style.fontSize = (size -= 0.5) + "px";
      };
    },
    table(b, box) {
      const tot = b.widths.reduce((a, x) => a + x, 0);
      const t = el("table", "tbl" + (b.align === "right" ? " right" : ""));
      t.innerHTML = `<colgroup>${b.widths.map((w) => `<col style="width:${(w / tot) * 100}%">`).join("")}</colgroup>` +
        b.rows.map((r, i) => {
          const tag = i ? "td" : "th";
          const cls = i && String(r[0]).startsWith("几何") ? ' class="total rv"' : i ? ' class="rv"' : "";
          const cell = (c) => /^\.|\.(md|py|gzg)$/.test(String(c)) && i ? `<code>${esc(c)}</code>` : esc(c);
          return `<tr${cls} style="--d:${i * 70}">${r.map((c) => `<${tag}>${cell(c)}</${tag}>`).join("")}</tr>`;
        }).join("");
      box.append(t);
      box.fit = () => {   // 先按设计字号排，放不下再缩小；放得下且有富余就拉开行高
        let size = (b.size || 13) * PT;
        t.style.fontSize = size + "px";
        while (size > 12 && t.offsetHeight > box.clientHeight) t.style.fontSize = (size -= 0.5) + "px";
        const spare = box.clientHeight - t.offsetHeight;
        if (spare > 0) t.querySelectorAll("td,th").forEach((c) => (c.style.paddingBlock = 9 + Math.min(10, spare / b.rows.length / 2) + "px"));
      };
    },
    cards(b, box) {
      const wrap = el("div");
      wrap.style.cssText = "position:absolute;inset:0;display:flex;gap:30px";
      b.items.forEach((it, i) => {
        const c = el("div", "card rv" + (it.accent === "warm" ? " warm" : ""));
        c.style.cssText = `position:relative;flex:1;--d:${i * 140};font-size:${(b.size || 13) * PT}px`;
        c.innerHTML = `<h3>${esc(it.title)}</h3><ul>${it.body.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
        wrap.append(c);
      });
      box.append(wrap);
    },
    pipeline(b, box) {
      const p = el("div", "pipe");
      p.innerHTML = b.stages.map(([t, d], i) => `<div class="st${i === 2 || i === 4 ? " hot" : ""}"><h4>${esc(t)}</h4><p>${esc(d.split(" · ").join("\n"))}</p></div>`).join("")
        + '<span class="packet"></span>';
      box.append(p);
    },
    steps(b, box) {
      const s = el("div", "steps");
      s.innerHTML = '<div class="rail"><b></b></div>' + b.items.map(([t, d], i) => `<div class="s"><div class="dot">${i + 1}</div><h4>${esc(t)}</h4><p>${esc(d)}</p></div>`).join("");
      box.append(s);
    },
    bars(b, box) {
      const max = Math.max(...b.items.map((x) => x[1]));
      const w = el("div", "bars");
      w.innerHTML = `<div class="cap">${esc(b.title)}</div>` + b.items.map(([n, v]) =>
        `<div class="row" data-tip="${esc(n)}：${v.toLocaleString()} ${esc(b.unit)}"><span class="n">${esc(n)}</span><span class="t"><b data-w="${(v / max) * 100}"></b></span><span class="v">${v.toLocaleString()}</span></div>`).join("");
      box.append(w);
    },
    pills(b, box) { box.append(el("div", "pills", b.items.map((x, i) => `<span class="pill rv" style="--d:${300 + i * 80}">${esc(x)}</span>`).join(""))); },
    quote(b, box) { box.append(el("div", "quote", esc(b.text))); },
    chart(b, box) { box.append(el("div", "chart")); },
    board2048(b, box) { box.append(el("div", "g2048")); },
  };

  function frame(s, d, n, total) {
    s.append(el("div", "footer", `<span>GZG · 郭志罡 · 程序设计实践</span><span class="num">${String(n).padStart(2, "0")} / ${String(total).padStart(2, "0")}</span>`));
    s.append(el("div", "kicker rv", esc(d.kicker || "")));
    s.append(el("div", "title rv", esc(d.title)));
    s.querySelector(".title").style.setProperty("--d", 80);
    if (d.sub) { const sub = el("div", "sub rv", esc(d.sub)); sub.style.setProperty("--d", 160); s.append(sub); }
    const top = d.sub ? 2.55 : 2.12, row = (H_IN - 0.75 - top) / 6;
    d.blocks.forEach((b, i) => {
      const [c, r, cw, rh] = b.area;
      const box = el("div", "blk " + (["cards", "bullets", "pills"].includes(b.type) ? "" : "rv"));
      box.style.cssText = `left:${(GRID_X + c * COL) * IN}px;top:${(top + r * row) * IN}px;width:${(cw * COL - 0.12) * IN}px;height:${(rh * row - 0.12) * IN}px;--d:${220 + i * 160}`;
      box.dataset.type = b.type;
      s.append(box);
      (B[b.type] || (() => {}))(b, box);
      box.block = b;
    });
  }

  function cover(s, d) {
    s.classList.add("cover");
    s.innerHTML = `<div class="t1">${[...d.title].map((ch, i) => `<span style="--i:${i}">${ch === " " ? "&nbsp;" : esc(ch)}</span>`).join("")}</div>
      <div class="en rv" style="--d:900">${esc(d.en)}</div><div class="s2 rv" style="--d:1200">${esc(d.sub)}</div>
      <div class="rule"></div><div class="au rv" style="--d:1500">${esc(d.author)}</div>`;
  }

  function ending(s, d) {
    s.classList.add("cover", "end");
    s.innerHTML = `<div class="t1" style="top:150px">${[...d.title].map((ch, i) => `<span style="--i:${i}">${esc(ch)}</span>`).join("")}</div>
      <div class="en rv" style="top:278px;--d:600">${esc(d.en)}</div><div class="panel rv" style="--d:800"><ul class="bullets" style="font-size:22px">
      ${d.items.map((x, i) => `<li class="rv" style="--d:${1000 + i * 120}">${richText(x)}</li>`).join("")}</ul></div>`;
  }

  function build(deck) {
    const stage = document.getElementById("stage");
    deck.forEach((d, i) => {
      const s = el("section", "slide after");
      s.dataset.bg = d.bg || "dark";
      s.dataset.title = d.title;
      if (d.kind === "cover") cover(s, d); else if (d.kind === "end") ending(s, d); else frame(s, d, i + 1, deck.length);
      stage.append(s);
    });
    stage.querySelectorAll(".blk").forEach((box) => box.fit && box.fit());
    return [...stage.querySelectorAll(".slide")];
  }

  return { build };
})();

/* 各版块的交互：数字滚动、条形图、流水线光点、步骤轮播、性能图表、可玩的 2048、悬浮提示。 */
const Widgets = (() => {
  const tip = document.createElement("div");
  tip.className = "tip";
  document.body.append(tip);
  document.addEventListener("mousemove", (e) => {
    const t = e.target.closest && e.target.closest("[data-tip]");
    if (!t) { tip.classList.remove("on"); return; }
    tip.innerHTML = t.dataset.tip;
    tip.style.left = e.clientX + "px";
    tip.style.top = e.clientY + "px";
    tip.classList.add("on");
  });

  const timers = new Map();   // 每页离开时清理的定时器
  const later = (slide, fn, ms, every) => {
    const id = every ? setInterval(fn, ms) : setTimeout(fn, ms);
    (timers.get(slide) || timers.set(slide, []).get(slide)).push([id, every]);
  };

  function countUp(node) {
    if (document.body.classList.contains("capture")) return;
    const raw = node.dataset.to, dec = (raw.split(".")[1] || "").length, to = parseFloat(raw.replace(/,/g, ""));
    const t0 = performance.now(), fmt = (v) => dec ? v.toFixed(dec) : Math.round(v).toLocaleString("en-US");
    const step = (t) => {
      const k = Math.min(1, (t - t0) / 1400), e = 1 - Math.pow(1 - k, 3);
      node.textContent = fmt(to * e);
      if (k < 1) requestAnimationFrame(step);
    };
    node.textContent = fmt(0);
    setTimeout(() => requestAnimationFrame(step), 500);
  }

  function pipeline(slide, p) {
    const st = [...p.querySelectorAll(".st")], pk = p.querySelector(".packet");
    let i = 0;
    const tick = () => {
      st.forEach((s, k) => s.classList.toggle("lit", k === i));
      const r = st[i].offsetLeft + st[i].offsetWidth / 2 - 6;
      pk.style.transition = i ? "left .9s cubic-bezier(.2,.8,.2,1)" : "none";
      pk.style.left = r + "px";
      i = (i + 1) % st.length;
    };
    later(slide, tick, 600);
    later(slide, tick, 1100, true);
  }

  function steps(slide, s) {
    const items = [...s.querySelectorAll(".s")], rail = s.querySelector(".rail b");
    let i = 0;
    const tick = () => {
      items.forEach((x, k) => x.classList.toggle("on", k <= i));
      rail.style.width = (i / (items.length - 1)) * 100 + "%";
      i = (i + 1) % (items.length + 1);
      if (i === 0) { items.forEach((x) => x.classList.remove("on")); rail.style.width = "0"; }
    };
    later(slide, tick, 700);
    later(slide, tick, 1000, true);
  }

  /* ---------------- 性能图表 ---------------- */
  function chart(node, bench, mode = "time") {
    const W = node.clientWidth, H = node.clientHeight - 40, L = 56, R = 10, T = 16, Bm = 34;
    const res = bench.results, n = res.length, gw = (W - L - R) / n;
    const time = mode === "time";
    const top = Math.max(...res.map((r) => (time ? r.python : r.speedup)));
    const stepV = time ? 0.25 : 0.5, ticks = Math.ceil(top / stepV), max = ticks * stepV;
    const y = (v) => T + (H - T - Bm) * (1 - v / max);
    let svg = `<svg viewBox="0 0 ${W} ${H}"><g class="grid">`;
    for (let k = 0; k <= ticks; k++) {
      const v = k * stepV;
      svg += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${time ? v.toFixed(2) + "s" : v.toFixed(1) + "×"}</text>`;
    }
    svg += "</g>";
    if (!time) svg += `<line x1="${L}" x2="${W - R}" y1="${y(1)}" y2="${y(1)}" stroke="#e2554f" stroke-dasharray="6 6" stroke-width="1.5"/>
      <text x="${L + 6}" y="${y(1) + 18}" style="fill:#e2554f">1× = 与 CPython 持平</text>`;
    res.forEach((r, i) => {
      const x0 = L + i * gw;
      const tipTxt = `<b>${r.name}</b>　${r.desc}<br>GZG ${r.gzg.toFixed(3)}s · Python ${r.python.toFixed(3)}s<br>Python/GZG = <b>${r.speedup.toFixed(2)}×</b>`;
      const bars = time ? [[r.gzg, "#5b95f7", 0.16], [r.python, "#f2a65a", 0.52]] : [[r.speedup, r.speedup >= 1 ? "#5b95f7" : "#e2554f", 0.25]];
      bars.forEach(([v, c, off]) => {
        const bw = gw * (time ? 0.32 : 0.5);
        svg += `<rect class="bar" data-tip="${tipTxt.replace(/"/g, "&quot;")}" x="${x0 + gw * off}" width="${bw}" rx="4" fill="${c}" y="${y(v)}" height="${y(0) - y(v)}" style="transform-origin:0 ${y(0)}px;transform:scaleY(0)"/>`;
      });
      if (!time) svg += `<text x="${x0 + gw / 2}" y="${y(r.speedup) - 8}" text-anchor="middle" style="fill:#fff;font-weight:700">${r.speedup.toFixed(2)}×</text>`;
      svg += `<text x="${x0 + gw / 2}" y="${H - 10}" text-anchor="middle">${r.name}</text>`;
    });
    node.querySelector("svg")?.remove();
    node.insertAdjacentHTML("beforeend", svg + "</svg>");
    node.querySelector(".legend").innerHTML = time
      ? '<span><i style="background:#5b95f7"></i>GZG</span><span><i style="background:#f2a65a"></i>Python 3.12</span>'
      : `<span>几何平均 <b style="color:#fff">${bench.meta.geomean.toFixed(2)}×</b>（蓝色 = GZG 更快）</span>`;
    const capture = document.body.classList.contains("capture");
    (capture ? (f) => f() : (f) => requestAnimationFrame(() => setTimeout(f, 60)))(() => node.querySelectorAll(".bar").forEach((b, i) => {
      b.style.transitionDelay = i * 45 + "ms";
      b.style.transform = "scaleY(1)";
    }));
  }

  function initChart(node, bench) {
    node.innerHTML = '<div class="legend"></div><div class="tabs"><button data-m="time" class="on">耗时</button><button data-m="ratio">倍数</button></div>';
    node.querySelectorAll("button").forEach((b) => (b.onclick = () => {
      node.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
      chart(node, bench, b.dataset.m);
    }));
    node.mode = () => node.querySelector("button.on").dataset.m;
  }
  /* ---------------- 可玩的 2048：默认 AI 自动玩，按 WASD 接管，空格切换 AI，R 重开 ---------------- */
  const COLORS = { 2: "#1e2c5a", 4: "#24356b", 8: "#2a417f", 16: "#2f4e95", 32: "#3459ab", 64: "#3a66c2", 128: "#4a78d2",
    256: "#4f80d8", 512: "#5a8ce2", 1024: "#6a96e6", 2048: "#e2554f", 4096: "#d84843", 8192: "#c73b3a", 16384: "#f2a65a" };
  function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  function slide4(row) {   // 一行向左合并，返回 [新行, 得分, 合并位置]
    const xs = row.filter((v) => v), out = [], merged = [];
    let score = 0;
    for (let i = 0; i < xs.length; i++) {
      if (xs[i] === xs[i + 1]) { out.push(xs[i] * 2); score += xs[i] * 2; merged.push(out.length - 1); i++; } else out.push(xs[i]);
    }
    while (out.length < 4) out.push(0);
    return [out, score, merged];
  }
  const LINES = { a: (i) => [0, 1, 2, 3].map((k) => i * 4 + k), d: (i) => [3, 2, 1, 0].map((k) => i * 4 + k),
    w: (i) => [0, 1, 2, 3].map((k) => k * 4 + i), s: (i) => [3, 2, 1, 0].map((k) => k * 4 + i) };
  function move(cells, dir) {
    const next = cells.slice(), merged = new Set();
    let score = 0;
    for (let i = 0; i < 4; i++) {
      const idx = LINES[dir](i), [row, sc, m] = slide4(idx.map((k) => cells[k]));
      idx.forEach((k, j) => (next[k] = row[j]));
      m.forEach((j) => merged.add(idx[j]));
      score += sc;
    }
    return { next, score, merged, moved: next.some((v, i) => v !== cells[i]) };
  }
  const SNAKE = [15, 14, 13, 12, 8, 9, 10, 11, 7, 6, 5, 4, 0, 1, 2, 3].map((k) => Math.pow(4, k));
  const heur = (c) => c.reduce((a, v, i) => a + v * SNAKE[i], 0) + c.filter((v) => !v).length * 4096;
  function aiMove(cells) {
    let best = null, bv = -1;
    for (const d of "wasd") {
      const r = move(cells, d);
      if (!r.moved) continue;
      const empties = r.next.map((v, i) => (v ? -1 : i)).filter((i) => i >= 0);
      let tot = 0;   // 对每个空格放 2 取平均（期望值的简化）
      for (const e of empties) { const n = r.next.slice(); n[e] = 2; tot += heur(n); }
      const v = empties.length ? tot / empties.length : heur(r.next);
      if (v > bv) { bv = v; best = d; }
    }
    return best;
  }

  function game2048(node, initial) {
    const size = Math.min(node.clientWidth, node.clientHeight - 80), gap = size * 0.03, cell = (size - gap * 5) / 4;
    node.innerHTML = `<div class="board" style="width:${size}px;height:${size}px"></div><div class="info"></div>`;
    const board = node.querySelector(".board"), info = node.querySelector(".info");
    const st = { cells: initial.flat(), score: 290724, ai: true, rand: rng(3), over: false, timer: null, born: new Set(), merged: new Set() };
    const draw = () => {
      board.innerHTML = st.cells.map((v, i) => v ? `<div class="tile${st.born.has(i) ? " new" : ""}${st.merged.has(i) ? " merged" : ""}"
        style="left:${gap + (i % 4) * (cell + gap)}px;top:${gap + Math.floor(i / 4) * (cell + gap)}px;width:${cell}px;height:${cell}px;
        background:${COLORS[v] || "#f2a65a"};font-size:${cell * (v < 100 ? 0.42 : v < 1000 ? 0.34 : v < 10000 ? 0.27 : 0.22)}px">${v}</div>` : "").join("");
      const mx = Math.max(...st.cells);
      info.innerHTML = `分数 <b>${st.score.toLocaleString()}</b> · 最大块 <b>${mx}</b> · ${st.ai ? "AI 自动玩中" : "手动模式"}${st.over ? " · <b>游戏结束</b>" : ""}<br>
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 接管 · <kbd>空格</kbd> 切换 AI · <kbd>R</kbd> 重开`;
    };
    const spawn = () => {
      const e = st.cells.map((v, i) => (v ? -1 : i)).filter((i) => i >= 0);
      if (!e.length) return;
      const k = e[Math.floor(st.rand() * e.length)];
      st.cells[k] = st.rand() < 0.9 ? 2 : 4;
      st.born = new Set([k]);
    };
    const step = (dir) => {
      if (st.over) return;
      const r = move(st.cells, dir);
      if (!r.moved) return;
      st.cells = r.next;
      st.score += r.score;
      st.merged = r.merged;
      spawn();
      st.over = !"wasd".split("").some((d) => move(st.cells, d).moved);
      draw();
    };
    const reset = () => { st.cells = Array(16).fill(0); st.score = 0; st.over = false; st.merged = new Set(); spawn(); spawn(); draw(); };
    let pause = false;
    const tick = () => {
      if (!st.ai || pause) return;
      if (st.over) { pause = true; setTimeout(() => { reset(); pause = false; }, 2000); return; }
      const d = aiMove(st.cells);
      if (d) step(d); else { st.over = true; draw(); }
    };
    draw();
    return {
      start() { reset(); st.ai = true; st.timer = setInterval(tick, 140); },
      stop() { clearInterval(st.timer); },
      key(k) {
        k = k.toLowerCase();
        if ("wasd".includes(k) && k.length === 1) { st.ai = false; step(k); return true; }
        if (k === " ") { st.ai = !st.ai; draw(); return true; }
        if (k === "r") { reset(); return true; }
        return false;
      },
    };
  }

  let game = null;
  return {
    init(slides, deck, bench) {
      slides.forEach((s) => {
        const c = s.querySelector(".chart");
        if (c) initChart(c, bench);
        const g = s.querySelector(".g2048");
        if (g) s.game = game2048(g, deck[slides.indexOf(s)].blocks.find((b) => b.type === "board2048").board);
      });
    },
    enter(s) {
      s.querySelectorAll(".count").forEach(countUp);
      s.querySelectorAll(".bars b").forEach((b, i) => setTimeout(() => (b.style.width = b.dataset.w + "%"), 450 + i * 40));
      s.querySelectorAll(".pipe").forEach((p) => pipeline(s, p));
      s.querySelectorAll(".steps").forEach((x) => steps(s, x));
      s.querySelectorAll(".chart").forEach((c) => (document.body.classList.contains("capture") ? chart(c, window.BENCH, c.mode())
        : setTimeout(() => chart(c, window.BENCH, c.mode()), 350)));
      if (s.game) { game = s.game; if (!document.body.classList.contains("capture")) later(s, () => game.start(), 1600); }
    },
    leave(s) {
      (timers.get(s) || []).forEach(([id, every]) => (every ? clearInterval(id) : clearTimeout(id)));
      timers.delete(s);
      s.querySelectorAll(".bars b").forEach((b) => (b.style.width = "0"));
      if (s.game) { s.game.stop(); game = null; }
    },
    key(k) { return game ? game.key(k) : false; },
  };
})();

/* 翻页、键盘 / 滚轮 / 触摸、总览模式、全屏、URL 定位。 */
(() => {
  if (location.search.includes("capture")) document.body.classList.add("capture");
  const slides = Render.build(window.DECK);
  Widgets.init(slides, window.DECK, window.BENCH);
  const bgs = Object.fromEntries([...document.querySelectorAll("#bg .img")].map((e) => [e.dataset.k, e]));
  const progress = document.getElementById("progress"), dots = document.getElementById("dots");
  let cur = -1, lock = 0;

  slides.forEach((s, i) => {
    const a = document.createElement("a");
    a.innerHTML = `<span>${String(i + 1).padStart(2, "0")} · ${s.dataset.title}</span>`;
    a.onclick = () => go(i);
    dots.append(a);
    s.addEventListener("click", () => { if (document.body.classList.contains("overview")) { toggleOverview(false); go(i); } });
  });

  function go(n, warp = true) {
    n = Math.max(0, Math.min(slides.length - 1, n));
    if (n === cur) return;
    const prev = cur;
    cur = n;
    slides.forEach((s, i) => {
      s.classList.toggle("active", i === n);
      s.classList.toggle("before", i < n);
      s.classList.toggle("after", i > n);
    });
    if (prev >= 0) Widgets.leave(slides[prev]);
    Widgets.enter(slides[n]);
    const k = slides[n].dataset.bg;
    Object.entries(bgs).forEach(([key, e]) => e.classList.toggle("on", key === k));
    Stars.set(k, n);
    if (warp && prev >= 0) Stars.warp(Math.min(1.2, 0.5 + Math.abs(n - prev) * 0.25));
    progress.style.width = ((n + 1) / slides.length) * 100 + "%";
    [...dots.children].forEach((d, i) => d.classList.toggle("on", i === n));
    history.replaceState(null, "", "#" + (n + 1));
  }

  const next = () => go(cur + 1), prev = () => go(cur - 1);

  function toggleOverview(force) {
    const on = document.body.classList.toggle("overview", force);
    const cols = 6, rows = Math.ceil(slides.length / cols);
    slides.forEach((s, i) => {
      s.style.setProperty("--ox", ((i % cols) - (cols - 1) / 2) * 1700);
      s.style.setProperty("--oy", (Math.floor(i / cols) - (rows - 1) / 2) * 960);
    });
    if (!on) slides.forEach((s) => { s.style.removeProperty("--ox"); s.style.removeProperty("--oy"); });
  }

  addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (Widgets.key(e.key)) { e.preventDefault(); return; }
    const k = e.key;
    if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(k)) { e.preventDefault(); next(); }
    else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(k)) { e.preventDefault(); prev(); }
    else if (k === "Home") go(0);
    else if (k === "End") go(slides.length - 1);
    else if (k === "o" || k === "O" || k === "Escape") toggleOverview(k === "Escape" ? false : undefined);
    else if (k === "f" || k === "F") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    else if (/^[1-9]$/.test(k)) go(+k - 1);
  });

  addEventListener("wheel", (e) => {
    if (document.body.classList.contains("overview")) return;
    const now = Date.now();
    if (now - lock < 900 || Math.abs(e.deltaY) < 20) return;
    lock = now;
    e.deltaY > 0 ? next() : prev();
  }, { passive: true });

  let tx = 0, ty = 0;
  addEventListener("touchstart", (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  addEventListener("touchend", (e) => {
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 50) return;
    (Math.abs(dx) > Math.abs(dy) ? dx : dy) < 0 ? next() : prev();
  }, { passive: true });

  document.querySelector(".brand").onclick = () => go(0);

  function resize() {
    const s = Math.min(innerWidth / 1600, innerHeight / 900);
    document.documentElement.style.setProperty("--scale", s);
  }
  addEventListener("resize", resize);
  resize();
  const start = parseInt(location.hash.slice(1), 10);
  go(Number.isFinite(start) ? start - 1 : 0, false);
})();
</script>
